[project]
name = "pysad"
version = "0.2.0"
description = "Python Simple ABI Decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tony Rocco Valentine", email = "tonyroccovalentine@protonmail.com" },
    { name = "Ilias Tsatiris", email = "ilias@dedaub.com" },
]
dependencies = [
    "eth-abi>=5.0.0",
    "eth-hash[pycryptodome]>=0.5.1",
    "eth-utils>=5.0.0",
    "pyevmasm>=0.2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.2.0,<2",
    "pytest>=7.3.1,<8",
    "ruff>=0.0.262,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysad"]
